name: Validate Deploy Configs

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docker Compose & Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. 使用示例环境变量填充 .env，执行 docker compose config -q 严格校验 YAML 结构与锚点语法
      - name: Validate Docker Compose files
        run: |
          cp personal-blog/.env.example personal-blog/.env
          docker compose -f personal-blog/compose.yml config -q
          docker compose -f dockge-compose.yml config -q

      # 2. 生成合法的临时自签名 PEM 证书，使用官方 Caddy 2.11 镜像校验 Caddyfile 语法与 Snippet 引用
      - name: Validate Caddyfile syntax
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout personal-blog/caddy/certs/chonkybird.com.key \
            -out personal-blog/caddy/certs/chonkybird.com.pem \
            -days 1 -subj "/CN=chonkybird.com"
          docker run --rm \
            -v "${{ github.workspace }}/personal-blog/caddy:/etc/caddy:ro" \
            caddy:2.11.1-alpine \
            caddy validate --config /etc/caddy/Caddyfile

  # ============================================================================
  # GitOps 持续部署任务：仅在 main 分支推送且上方语法校验通过后执行
  # ============================================================================
  deploy:
    name: GitOps Sync to Production VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sync repository & apply declarative Compose state on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 8m
          script: |
            set -e
            echo "==> [GitOps] 1. 同步远端部署仓 /opt/personal-blog-deploy 至最新 main 分支..."
            cd /opt/personal-blog-deploy
            git fetch origin main
            git reset --hard origin/main

            echo "==> [GitOps] 2. 拉取并按声明式状态差分更新无状态业务容器 (backend / frontend / admin)..."
            cd /opt/personal-blog-deploy/personal-blog
            sudo docker compose -f compose.yml pull backend frontend admin
            sudo docker compose -f compose.yml up -d backend frontend admin

            echo "==> [GitOps] 3. 清理被替换下来的旧镜像缓存..."
            sudo docker image prune -f
            echo "==> [GitOps] 同步完成！"


name: Validate Deploy Configs

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docker Compose & Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. 使用示例环境变量填充 .env，执行 docker compose config -q 严格校验 YAML 结构与锚点语法
      - name: Validate Docker Compose files
        run: |
          cp personal-blog/.env.example personal-blog/.env
          docker compose -f personal-blog/compose.yml config -q
          docker compose -f dockge-compose.yml config -q

      # 2. 使用官方 Caddy 2.11 镜像结合占位证书，校验 Caddyfile 语法与 Snippet 引用是否合法
      - name: Validate Caddyfile syntax
        run: |
          cp personal-blog/caddy/certs/chonkybird.com.pem.example personal-blog/caddy/certs/chonkybird.com.pem
          cp personal-blog/caddy/certs/chonkybird.com.key.example personal-blog/caddy/certs/chonkybird.com.key
          docker run --rm \
            -v "${{ github.workspace }}/personal-blog/caddy:/etc/caddy:ro" \
            caddy:2.11.1-alpine \
            caddy validate --config /etc/caddy/Caddyfile
